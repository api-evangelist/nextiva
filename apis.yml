apis:
- aid: nextiva:provider-authentication
  name: Nextiva Provider Authentication API
  description: Login and token refresh for the Nextiva Contact Center platform. Basic
    authentication generates a JWT bearer token carrying the user's authorities; the
    token-refresh operation exchanges an existing bearer token for a new one. Every
    other Nextiva API requires the token this API issues.
  humanURL: https://developer.nextiva.com/nextiva/reference/generatetokenwithauthorities
  baseURL: https://api.nextiva.com
  tags:
  - Authentication
  - Tokens
  - Security
  properties:
  - type: OpenAPI
    url: openapi/nextiva-authentication-openapi.yml
  - type: Overlay
    url: overlays/nextiva-authentication-overlay.yaml
  - type: Documentation
    url: https://developer.nextiva.com/nextiva/docs/authentication
- aid: nextiva:provider-token-service
  name: Nextiva Provider Token Service API
  description: Spring-secured provider token endpoints that mint JWTs with user authorities,
    authenticate a user and redirect with a secure token, and generate time-limited
    multi-tenant portal access tokens.
  humanURL: https://developer.nextiva.com/nextiva/reference/generatetokenwithauthorities
  baseURL: https://api.nextiva.com/provider
  tags:
  - Authentication
  - Tokens
  - Multi-Tenant
  properties:
  - type: OpenAPI
    url: openapi/nextiva-provider-authentication-openapi.yml
  - type: Overlay
    url: overlays/nextiva-provider-authentication-overlay.yaml
- aid: nextiva:workitem-service
  name: Nextiva Workitem Service API
  description: Retrieve and control workitems — the unit of work in the Nextiva Contact
    Center — and the calls attached to them. Fetch workitems and workitem detail,
    bridge, hold, hang up, mute and unmute a call, send DTMF digits, change ACD priority,
    send an email response, and transfer a call to another agent or to an inbox queue.
  humanURL: https://developer.nextiva.com/nextiva/reference/fetchworkitems
  baseURL: https://api.nextiva.com
  tags:
  - Work Items
  - Call Control
  - Contact Center
  - Transfers
  - DTMF
  - Email
  tags_raw:
  - Workitems
  - Call Control
  - Contact Center
  - Transfers
  - DTMF
  - Email
  properties:
  - type: OpenAPI
    url: openapi/nextiva-workitem-service-openapi.yml
  - type: Overlay
    url: overlays/nextiva-workitem-service-overlay.yaml
  - type: Documentation
    url: https://developer.nextiva.com/nextiva/docs/workitem-service
- aid: nextiva:conversation
  name: Nextiva Conversation API
  description: Read the conversation graph across the contact center — conversations
    and their workitems, conversation history by participant, campaign and ticket
    scoped conversations, unread counts, conversation activity summaries, and the
    transcriptions and call recordings attached to a workitem.
  humanURL: https://developer.nextiva.com/nextiva/reference/fetchconversations
  baseURL: https://api.nextiva.com
  tags:
  - Conversations
  - Analytics
  - Transcription
  - Recordings
  - Campaigns
  - Tickets
  properties:
  - type: OpenAPI
    url: openapi/nextiva-conversation-openapi.yml
  - type: Overlay
    url: overlays/nextiva-conversation-overlay.yaml
  - type: Documentation
    url: https://developer.nextiva.com/nextiva/docs/conversation-service
- aid: nextiva:sms-messaging
  name: Nextiva SMS Messaging API
  description: Send outbound SMS messages from a Nextiva user. Inbound SMS arrives
    as a workitem on the SDK event stream rather than as a customer-configured webhook.
  humanURL: https://developer.nextiva.com/nextiva/reference/sendsmsmessage
  baseURL: https://api.nextiva.com
  tags:
  - SMS
  - Messaging
  - Text
  properties:
  - type: OpenAPI
    url: openapi/nextiva-sms-messaging-openapi.yml
  - type: Overlay
    url: overlays/nextiva-sms-messaging-overlay.yaml
  - type: Documentation
    url: https://developer.nextiva.com/nextiva/reference/inbound-and-outbound-sms
