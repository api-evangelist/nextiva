aid: nextiva
name: Nextiva
description: 'Nextiva is a Scottsdale, Arizona based cloud communications and customer
  experience company whose NextOS / NEXT platform combines UCaaS business phone service,
  contact center (NCX), SMS and team messaging, voice AI agents, and conversation
  analytics for small business through enterprise. Its developer surface is the Nextiva
  Contact Center platform: a ReadMe-hosted developer portal at developer.nextiva.com
  publishing five REST OpenAPI 3.0 contracts (Provider Authentication, Provider Token
  Service, Workitem Service, Conversation, SMS Messaging) served from api.nextiva.com,
  alongside four frontend SDKs (Core, Web, React, React Native) that wrap the same
  backend over HTTP plus two WebSocket channels — an events socket for real-time
  workitem, offer, phone-state and live-transcription notifications, and an analytics
  socket for supervisory data.'
