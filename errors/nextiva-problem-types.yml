notes: >-
  Nextiva does NOT use RFC 9457 problem+json. Two error envelopes are in use
  across the five published contracts. Four of the five specs share a minimal
  {code, message} object served as application/json; the Provider Token Service
  (openapi 3.0.3) uses a richer ErrorResponse {type, message, code, timestamp}.
  No published error-code registry was found in the developer docs, so the
  concrete `code` values are undocumented — only the HTTP statuses and
  descriptions below are declared. Nine of the eleven Workitem Service
  operations and all ten Conversation operations declare ONLY a `default`
  error response, so an agent cannot distinguish 401 from 404 from 500 on the
  call-control and conversation surfaces from the contract alone.
