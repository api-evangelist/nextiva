summary: >-
  Entity-relationship graph derived from the schema $refs and id-reference
  fields in the published Nextiva Contact Center contracts. The core is the
  Workitem — the unit of work an agent handles — which hangs off a Conversation
  and is scoped by Tenant. Ids are opaque UUID strings with no type prefixes.
entities:
- name: Tenant
  id_field: tenantId
  described_in: openapi/nextiva-conversation-openapi.yml#/components/schemas/Conversation
  note: Multi-tenant scoping key present on Conversation; also the subject of the
    Provider Token Service portal/location token operations.
- name: Conversation
  id_field: conversationId
  alt_ids: [_id, id]
  fields: [conversationType, name, topicName, description, phoneNumber, sharedInboxId,
    sharedInboxName, tenantId, parentEngagementId, parentTicketId, parentWorkitemId,
    participants, createdAt, createdBy, modifiedAt, modifiedBy, deletedAt, unreadCount,
    totalCount]
  operations: [fetchConversations, fetchConversationById, fetchConversationWorkItemsByStatus,
