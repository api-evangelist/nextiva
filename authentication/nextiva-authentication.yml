authorization:
  model: authorities
  detail: >-
    The token embeds the user's "authorities" — the Provider Token Service
    documents generating JWTs with various permission levels, plus time-limited
    portal access tokens and multi-tenant location-based tokens. A 403 "Access
    denied" is returned when the authenticated user lacks the authority for the
    requested token scope. No authority/permission catalog is published.
sdk_handling: >-
  Per the SDK architecture guide, the SDKs post credentials to the Provider
  Service, receive the token plus a payload describing where to route future
  requests, and attach the token to the HTTP header automatically on every
  subsequent call.
