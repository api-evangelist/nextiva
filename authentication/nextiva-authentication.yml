model: >-
  Two-step. HTTP basic credentials are exchanged for a JWT that carries the
  user's authorities; that JWT is then sent as an Authorization bearer token on
  every other operation and refreshed before expiry. There is no OAuth 2.0, no
  OpenID Connect, no API-key scheme and no mTLS anywhere in the published
  contracts, so there is also no scope surface (scopes/ is intentionally absent).
flow:
- step: 1
  operation: generateTokenWithAuthorities
  path: GET https://api.nextiva.com/provider/token-with-authorities
  auth: basicAuth
  returns: TokenResponse (JWT + user authorities)
- step: 2
  operation: '*'
  header: 'Authorization: Bearer <jwt>'
  auth: bearerAuth
- step: 3
  operation: refreshToken
  path: GET https://api.nextiva.com/provider/api/token-refresh
  auth: bearerAuth
  returns: RefreshTokenResponse
  note: A 401 here means the token is already expired — restart at step 1.
schemes:
- name: basicAuth
  type: http
  scheme: basic
  description: Basic authentication using username and password.
  sources:
  - openapi/nextiva-authentication-openapi.yml
- name: bearerAuth
  type: http
  scheme: bearer
  bearerFormat: JWT
  description: Bearer token authentication (JWT).
  sources:
