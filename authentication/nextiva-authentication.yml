  - openapi/nextiva-sms-messaging-openapi.yml
  - openapi/nextiva-workitem-service-openapi.yml
- name: springAuth
  type: http
  scheme: bearer
  bearerFormat: JWT
  description: >-
    Spring Security authentication using JWT tokens. All endpoints require an
    authenticated user context.
  sources:
