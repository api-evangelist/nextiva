notes: >-
  Nextiva documents four frontend SDKs (Core, Web, React, React Native) for the
  Nextiva Contact Center (NCX) platform. The install commands published in the
  SDK Installation guide name SCOPED packages (@nextiva/ncx-web-sdk,
  @nextiva/ncx-react-sdk, @nextiva/ncx-react-native-sdk) — all three return HTTP
  404 from the public npm registry as of 2026-07-31, so the documented scoped
  packages are private/restricted and require registry access from Nextiva.
  Older UNSCOPED builds of the same SDKs (ncx-core-sdk, ncx-web-sdk,
  ncx-react-sdk, ncx-react-native-sdk, ncx-sdk) ARE published publicly on npm
  under the "nextiva" author with github.com/Nextiva repositories, and are
  recorded below. No Nextiva server-side SDK was found on PyPI, Maven Central,
  NuGet, pkg.go.dev, RubyGems, Packagist or crates.io.
